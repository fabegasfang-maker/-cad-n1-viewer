<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แผนผังการจ่ายไฟ กฟน.1</title>
    <meta name="description" content="เปิดดูแผนผังจ่ายไฟแบบออนไลน์ หรือดาวน์โหลดไฟล์แผนผังล่าสุด" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f6f8;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #e2e8f0;
        --primary: #1d4ed8;
        --primary-hover: #1e40af;
        --secondary-hover: #f1f5f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --card: #0f172a;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --line: #1e293b;
          --primary: #3b82f6;
          --primary-hover: #2563eb;
          --secondary-hover: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 32px 24px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 700;
        text-align: center;
      }
      .sub {
        margin: 6px 0 28px;
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .actions { display: flex; flex-direction: column; gap: 12px; }
      .btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 100%;
        min-height: 64px;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 1.05rem;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        justify-content: center;
      }
      .btn:hover { background: var(--secondary-hover); }
      .btn.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      .btn.primary:hover { background: var(--primary-hover); }
      .btn .big { font-size: 1.35rem; font-weight: 700; line-height: 1.2; }
      .btn small {
        font-size: 0.8rem;
        font-weight: 500;
        opacity: 0.9;
      }
      .btn .stamp {
        display: block;
        margin-top: 4px;
        font-size: 0.72rem;
        font-weight: 500;
        opacity: 0.85;
        min-height: 1em;
      }
      #status {
        margin: 16px 0 0;
        min-height: 1.4em;
        text-align: center;
        font-size: 0.88rem;
        color: var(--muted);
      }
      #status.error { color: #dc2626; }
      .credit {
        margin: 20px 0 0;
        text-align: center;
        font-size: 0.78rem;
        color: var(--muted);
      }
      #btn-settings {
        position: fixed;
        right: 12px;
        bottom: 12px;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--muted);
        font-size: 1.2rem;
        cursor: pointer;
        box-shadow: 0 1px 6px rgba(0,0,0,.12);
      }
      #btn-settings:hover { background: var(--secondary-hover); color: var(--text); }
      dialog {
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        background: var(--card);
        color: var(--text);
        max-width: 420px;
        width: calc(100% - 32px);
      }
      dialog::backdrop { background: rgba(15, 23, 42, 0.45); }
      dialog h2 { margin: 0 0 16px; font-size: 1.15rem; }
      dialog label {
        display: block;
        margin-bottom: 6px;
        font-size: 0.9rem;
        font-weight: 500;
      }
      dialog input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        font: inherit;
        font-size: 0.95rem;
      }
      dialog .hint {
        margin: 8px 0 0;
        font-size: 0.8rem;
        color: var(--muted);
      }
      dialog .hint.error { color: #dc2626; }
      dialog .row { display: flex; gap: 8px; margin-top: 20px; justify-content: flex-end; flex-wrap: wrap; }
      dialog .row button {
        padding: 10px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        cursor: pointer;
      }
      dialog .row button:hover { background: var(--secondary-hover); }
      dialog .row .save { background: var(--primary); border-color: var(--primary); color: #fff; }
      dialog .row .save:hover { background: var(--primary-hover); }
    </style>
  </head>
  <body>
    <main>
      <h1>แผนผังการจ่ายไฟ กฟน.1</h1>
      <p class="sub">เลือกวิธีเปิดดูแผนผัง</p>

      <div class="actions">
        <a class="btn primary" id="btn-mobile" href="map.html">
          <span class="big">PDF</span>
          <small>มือถือ/แท็บเล็ต/PC</small>
          <span class="stamp" id="stamp-pdf"></span>
        </a>
        <a class="btn primary" id="btn-pc" href="viewer.html?device=pc">
          <span class="big">CAD</span>
          <small>PC เท่านั้น</small>
          <span class="stamp" id="stamp-cad"></span>
        </a>
        <button class="btn" id="btn-download" type="button">
          ดาวน์โหลดไฟล์ .dwg
          <span class="stamp" id="stamp-download"></span>
        </button>
      </div>

      <p id="status" role="status" aria-live="polite"></p>
      <p class="credit">พัฒนาโดย ผคฟ.กปบ.น.1 (จตุพัชร คะระออม)</p>
    </main>

    <button id="btn-settings" type="button" aria-haspopup="dialog" aria-label="ตั้งค่า" title="ตั้งค่า">⚙</button>

    <dialog id="settings-dialog" aria-labelledby="settings-title">
      <form method="dialog" id="settings-form">
        <h2 id="settings-title">ตั้งค่า</h2>
        <label for="drive-input">ตำแหน่งไฟล์ / โฟลเดอร์ใน Google Drive</label>
        <input id="drive-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="วางลิงก์ Google Drive หรือ ID" />
        <p class="hint" id="drive-hint">ใช้เมื่อย้ายที่เก็บแผนผัง วางลิงก์โฟลเดอร์ใหม่ได้เลย ต้องแชร์เป็น "ทุกคนที่มีลิงก์"</p>
        <div class="row">
          <button type="button" id="settings-reset">ใช้ค่าเริ่มต้น</button>
          <button type="button" id="settings-cancel">ยกเลิก</button>
          <button type="submit" class="save">บันทึก</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
