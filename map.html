<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>แผนผังจ่ายไฟ (แบบแผนที่)</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <style>
      :root {
        --bg: #e5e7eb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #cbd5e1;
        --primary: #1d4ed8;
        --hover: #f1f5f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e293b;
          --card: #0f172a;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --line: #334155;
          --primary: #60a5fa;
          --hover: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font-family: 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-touch-callout: none;
      }
      #map { position: absolute; inset: 0; background: #fff; }
      .leaflet-container { background: #fff; font: inherit; -webkit-tap-highlight-color: transparent; }
      .leaflet-tile { image-rendering: auto; }

      #bar {
        position: absolute; z-index: 1000; left: 0; right: 0; top: 0;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left));
        display: flex; gap: 8px; align-items: center; pointer-events: none;
      }
      #bar > * { pointer-events: auto; }
      .chip {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 0 12px; border-radius: 12px;
        border: 1px solid var(--line); background: var(--card); color: var(--text);
        font: inherit; font-size: 0.9rem; text-decoration: none; box-shadow: 0 1px 6px rgba(0,0,0,.18);
        white-space: nowrap; cursor: pointer;
      }
      a.chip:hover, button.chip:hover { background: var(--hover); }
      button.chip {
        font: inherit;
      }
      button.chip.on {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      #search-wrap { position: relative; flex: 1; min-width: 0; }
      #q {
        width: 100%; min-height: 44px; padding: 0 14px; border-radius: 12px;
        border: 1px solid var(--line); background: var(--card); color: var(--text);
        font: inherit; font-size: 16px;
        box-shadow: 0 1px 6px rgba(0,0,0,.18);
      }
      #q::placeholder { color: var(--muted); }
      #results {
        position: absolute; left: 0; right: 0; top: 50px; max-height: 55vh; overflow-y: auto;
        margin: 0; padding: 4px 0; list-style: none; border-radius: 12px;
        border: 1px solid var(--line); background: var(--card); box-shadow: 0 4px 16px rgba(0,0,0,.25);
      }
      #results[hidden] { display: none; }
      #results li { padding: 11px 14px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid var(--line); }
      #results li:last-child { border-bottom: 0; }
      #results li:hover, #results li.active { background: var(--hover); }
      #results li.empty { color: var(--muted); cursor: default; }
      #q:focus-visible, .chip:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

      #info {
        position: absolute; z-index: 1000; left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom));
        max-width: calc(100% - 96px); padding: 6px 10px; border-radius: 10px;
        background: var(--card); color: var(--muted); border: 1px solid var(--line);
        font-size: 0.78rem; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .leaflet-bottom.leaflet-right { margin-bottom: env(safe-area-inset-bottom); margin-right: env(safe-area-inset-right); }
      .leaflet-bar a { width: 40px; height: 40px; line-height: 40px; font-size: 22px; }

      .cad-label {
        background: transparent !important;
        border: none !important;
      }
      .cad-label span {
        display: inline-block;
        white-space: nowrap;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
        line-height: 1.15;
        color: #0f172a;
        text-shadow:
          0 0 2px #fff,
          0 0 3px #fff,
          1px 0 0 #fff,
          -1px 0 0 #fff,
          0 1px 0 #fff,
          0 -1px 0 #fff;
        pointer-events: none;
        -webkit-font-smoothing: antialiased;
      }

      #msg {
        position: absolute; z-index: 900; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      #msg .card {
        max-width: 380px; padding: 24px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: center;
      }
      #msg h1 { margin: 0 0 8px; font-size: 1.15rem; }
      #msg p { margin: 0 0 16px; color: var(--muted); font-size: 0.92rem; }
      #msg .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      #msg[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="map" aria-label="แผนผังจ่ายไฟ ลากเพื่อเลื่อน ถ่างนิ้วเพื่อซูม"></div>

    <div id="bar">
      <a class="chip" href="./" aria-label="กลับหน้าแรก">← หน้าแรก</a>
      <button type="button" class="chip" id="btn-labels" aria-pressed="false" title="เปิด/ปิดป้ายชื่อคม (HTML)">ป้ายชื่อ: ปิด</button>
      <div id="search-wrap">
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="ค้นหาชื่อในผัง เช่น สถานี, หม้อแปลง" aria-label="ค้นหาชื่อในผัง" disabled />
        <ul id="results" hidden role="listbox"></ul>
      </div>
    </div>

    <div id="info" hidden></div>

    <div id="msg">
      <div class="card">
        <h1 id="msg-title">กำลังโหลดแผนผัง...</h1>
        <p id="msg-text">รอสักครู่</p>
        <div class="row" id="msg-actions" hidden>
          <a class="chip" href="./">กลับหน้าแรก</a>
          <a class="chip" href="viewer.html?device=mobile">เปิดตัวดู CAD แบบเดิม</a>
        </div>
      </div>
    </div>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script>
      (function () {
        'use strict';
        var BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
        var LABEL_KEY = 'cad_map_html_labels';
        var msg = document.getElementById('msg');

        function showMessage(title, text, actions) {
          document.getElementById('msg-title').textContent = title;
          document.getElementById('msg-text').textContent = text;
          document.getElementById('msg-actions').hidden = !actions;
          msg.hidden = false;
        }

        function esc(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function readLabelsOn() {
          try { return localStorage.getItem(LABEL_KEY) === '1'; } catch (e) { return false; }
        }
        function writeLabelsOn(on) {
          try { localStorage.setItem(LABEL_KEY, on ? '1' : '0'); } catch (e) {}
        }

        fetch('map/meta.json', { cache: 'no-cache' })
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(start)
          .catch(function () {
            showMessage(
              'ยังไม่มีแผนผังแบบแผนที่',
              'ระบบกำลังสร้างจากไฟล์ล่าสุด (ใช้เวลาประมาณ 10-20 นาที) ลองใหม่อีกครั้งภายหลัง หรือเปิดตัวดู CAD แบบเดิมไปก่อน',
              true
            );
          });

        function start(meta) {
          var Z = meta.maxZoom, W = meta.w, H = meta.h;
          var map = L.map('map', {
            crs: L.CRS.Simple,
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            wheelPxPerZoomLevel: 90,
            attributionControl: false,
            zoomControl: false,
            inertia: true,
            bounceAtZoomLimits: false,
            maxBoundsViscosity: 0.7
          });

          function ll(x, y) { return map.unproject([x, y], Z); }
          var bounds = L.latLngBounds(ll(0, H), ll(W, 0));
          var fitZoom = map.getBoundsZoom(bounds, false);
          map.setMinZoom(fitZoom - 0.5);
          map.setMaxZoom(Z + 2);

          L.tileLayer('map/tiles/{z}/{x}/{y}.webp', {
            tileSize: meta.tile || 256,
            minNativeZoom: 0,
            maxNativeZoom: Z,
            minZoom: fitZoom - 0.5,
            maxZoom: Z + 2,
            noWrap: true,
            bounds: bounds,
            errorTileUrl: BLANK,
            keepBuffer: 3,
            updateWhenIdle: false
          }).addTo(map);

          L.control.zoom({ position: 'bottomright', zoomInText: '+', zoomOutText: '−' }).addTo(map);
          map.fitBounds(bounds, { animate: false });
          map.setMaxBounds(bounds.pad(0.25));
          msg.hidden = true;

          var info = document.getElementById('info');
          var parts = [];
          if (meta.sourceModified) {
            var d = new Date(meta.sourceModified);
            if (!isNaN(d)) parts.push('ผังอัปเดต ' + d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }));
          }
          if (meta.sourceName) parts.push(meta.sourceName.replace(/\.(dwg|dxf)$/i, ''));
          if (parts.length) { info.textContent = parts.join(' · '); info.hidden = false; }

          setupSearchAndLabels(map, Z, ll);
        }

        function setupSearchAndLabels(map, Z, ll) {
          var q = document.getElementById('q');
          var list = document.getElementById('results');
          var btn = document.getElementById('btn-labels');
          var items = null, loading = false, marker = null;
          var labelLayer = L.layerGroup().addTo(map);
          var labelTimer = null;
          var labelsOn = readLabelsOn();

          function syncBtn() {
            btn.classList.toggle('on', labelsOn);
            btn.setAttribute('aria-pressed', labelsOn ? 'true' : 'false');
            btn.textContent = labelsOn ? 'ป้ายชื่อ: เปิด' : 'ป้ายชื่อ: ปิด';
          }
          syncBtn();

          btn.addEventListener('click', function () {
            labelsOn = !labelsOn;
            writeLabelsOn(labelsOn);
            syncBtn();
            scheduleLabels();
          });

          function load() {
            if (items || loading) return;
            loading = true;
            fetch('map/index.json', { cache: 'no-cache' })
              .then(function (r) { return r.json(); })
              .then(function (j) {
                items = (j.items || []).map(function (it) {
                  return {
                    t: it[0],
                    k: String(it[0]).toLowerCase(),
                    x: it[1],
                    y: it[2],
                    fs: it[3] || 10
                  };
                });
                items.sort(function (a, b) { return b.fs - a.fs; });
                q.disabled = false;
                if (q.value) render();
                scheduleLabels();
              })
              .catch(function () { q.placeholder = 'ค้นหาใช้ไม่ได้ในขณะนี้'; })
              .then(function () { loading = false; });
          }
          load();
          q.disabled = false;

          function search(text) {
            var s = text.trim().toLowerCase();
            if (!items || s.length < 1) return [];
            var starts = [], has = [];
            for (var i = 0; i < items.length; i++) {
              var p = items[i].k.indexOf(s);
              if (p === 0) starts.push(items[i]);
              else if (p > 0) has.push(items[i]);
              if (starts.length > 400 && has.length > 400) break;
            }
            function byLen(a, b) { return a.t.length - b.t.length; }
            return starts.sort(byLen).concat(has.sort(byLen)).slice(0, 40);
          }

          function render() {
            var text = q.value;
            if (!text.trim()) { list.hidden = true; return; }
            list.innerHTML = '';
            if (!items) {
              list.innerHTML = '<li class="empty">กำลังโหลดดัชนี...</li>';
              list.hidden = false;
              return;
            }
            var res = search(text);
            if (!res.length) {
              list.innerHTML = '<li class="empty">ไม่พบข้อความที่ตรงกัน</li>';
            }
            res.forEach(function (it) {
              var li = document.createElement('li');
              li.textContent = it.t.length > 80 ? it.t.slice(0, 80) + '…' : it.t;
              li.setAttribute('role', 'option');
              li.addEventListener('pointerdown', function (e) { e.preventDefault(); go(it); });
              list.appendChild(li);
            });
            list.hidden = false;
          }

          function go(it) {
            list.hidden = true;
            q.blur();
            var p = ll(it.x, it.y);
            map.flyTo(p, Z, { duration: 0.8 });
            if (marker) map.removeLayer(marker);
            marker = L.circleMarker(p, { radius: 26, color: '#dc2626', weight: 3, fillColor: '#dc2626', fillOpacity: 0.08 }).addTo(map);
            marker.on('click', function () { map.removeLayer(marker); marker = null; });
            setTimeout(scheduleLabels, 900);
          }

          function scheduleLabels() {
            if (labelTimer) clearTimeout(labelTimer);
            labelTimer = setTimeout(updateLabels, 120);
          }

          function updateLabels() {
            labelLayer.clearLayers();
            if (!labelsOn || !items || !items.length) return;

            var z = map.getZoom();
            // ต้องซูมใกล้พอ ไม่งั้นป้ายทับกันทั้งจอ
            if (z < Z - 1.5) return;

            var b = map.getBounds();
            var sw = map.project(b.getSouthWest(), Z);
            var ne = map.project(b.getNorthEast(), Z);
            var minX = Math.min(sw.x, ne.x) - 40;
            var maxX = Math.max(sw.x, ne.x) + 40;
            var minY = Math.min(sw.y, ne.y) - 40;
            var maxY = Math.max(sw.y, ne.y) + 40;

            var minFs = z >= Z ? 7 : 11;
            var maxLabels = z >= Z ? 220 : 100;
            var scale = Math.pow(2, Math.max(0, z - Z));
            // ตอนยังไม่ overzoom ใช้ขนาดใกล้เคียงตัวอักษรในผัง
            if (z <= Z) scale = Math.max(0.55, Math.pow(2, z - Z));
            var shown = 0;

            for (var i = 0; i < items.length; i++) {
              var it = items[i];
              if (it.fs < minFs) continue;
              if (it.x < minX || it.x > maxX || it.y < minY || it.y > maxY) continue;
              if (it.t.length > 60 && it.fs < 14) continue;

              var fontPx = Math.max(11, Math.min(30, it.fs * scale * 0.9));
              var icon = L.divIcon({
                className: 'cad-label',
                html: '<span style="font-size:' + fontPx.toFixed(1) + 'px">' + esc(it.t) + '</span>',
                iconSize: [1, 1],
                iconAnchor: [0, fontPx * 0.7]
              });
              L.marker(ll(it.x, it.y), { icon: icon, interactive: false, keyboard: false }).addTo(labelLayer);
              if (++shown >= maxLabels) break;
            }
          }

          q.addEventListener('input', render);
          q.addEventListener('focus', render);
          q.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { var r = search(q.value); if (r.length) go(r[0]); }
            if (e.key === 'Escape') { list.hidden = true; q.blur(); }
          });
          map.on('click movestart', function () { list.hidden = true; });
          map.on('moveend zoomend', scheduleLabels);
        }
      })();
    </script>
  </body>
</html>
