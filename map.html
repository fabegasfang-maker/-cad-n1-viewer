<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>แผนผังจ่ายไฟ (แบบแผนที่)</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
    <style>
      :root {
        --bg: #e5e7eb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --line: #cbd5e1;
        --primary: #1d4ed8;
        --hover: #f1f5f9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e293b;
          --card: #0f172a;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --line: #334155;
          --primary: #60a5fa;
          --hover: #1e293b;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font-family: 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-touch-callout: none;
      }
      #map { position: absolute; inset: 0; background: #fff; }
      .leaflet-container { background: #fff; font: inherit; -webkit-tap-highlight-color: transparent; }
      .leaflet-tile { image-rendering: auto; color: transparent; }

      #bar {
        position: absolute; z-index: 1000; left: 0; right: 0; top: 0;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left));
        display: flex; gap: 8px; align-items: center; pointer-events: none;
      }
      #bar > * { pointer-events: auto; }
      .chip {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 44px; padding: 0 12px; border-radius: 12px;
        border: 1px solid var(--line); background: var(--card); color: var(--text);
        font: inherit; font-size: 0.9rem; text-decoration: none; box-shadow: 0 1px 6px rgba(0,0,0,.18);
        white-space: nowrap; cursor: pointer;
      }
      /* ซ่อนปุ่ม "ป้ายชื่อ: เปิด/ปิด" (โค้ดยังอยู่) เปิดกลับ: ลบกฎนี้ และตั้ง LABELS_BUTTON_ENABLED = true ในสคริปต์ */
      #btn-labels { display: none !important; }
      .chip-icon { width: 44px; padding: 0; }
      a.chip:hover, button.chip:hover { background: var(--hover); }
      .leaflet-bar a.fit-btn { display: flex; align-items: center; justify-content: center; }
      button.chip {
        font: inherit;
      }
      button.chip.on {
        background: var(--primary);
        border-color: var(--primary);
        color: #fff;
      }
      #search-wrap { position: relative; flex: 1; min-width: 0; }
      #q {
        width: 100%; min-height: 44px; padding: 0 14px; border-radius: 12px;
        border: 1px solid var(--line); background: var(--card); color: var(--text);
        font: inherit; font-size: 16px;
        box-shadow: 0 1px 6px rgba(0,0,0,.18);
      }
      #q::placeholder { color: var(--muted); }
      #results {
        position: absolute; left: 0; right: 0; top: 50px; max-height: 55vh; overflow-y: auto;
        margin: 0; padding: 4px 0; list-style: none; border-radius: 12px;
        border: 1px solid var(--line); background: var(--card); box-shadow: 0 4px 16px rgba(0,0,0,.25);
      }
      #results[hidden] { display: none; }
      #results li { padding: 11px 14px; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid var(--line); }
      #results li:last-child { border-bottom: 0; }
      #results li:hover, #results li.active { background: var(--hover); }
      #results li.empty { color: var(--muted); cursor: default; }
      #q:focus-visible, .chip:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

      #info {
        position: absolute; z-index: 1000; left: max(8px, env(safe-area-inset-left)); bottom: max(8px, env(safe-area-inset-bottom));
        max-width: calc(100% - 96px); padding: 6px 10px; border-radius: 10px;
        background: var(--card); color: var(--muted); border: 1px solid var(--line);
        font-size: 0.78rem; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .leaflet-bottom.leaflet-right { margin-bottom: env(safe-area-inset-bottom); margin-right: env(safe-area-inset-right); }
      .leaflet-bar a { width: 40px; height: 40px; line-height: 40px; font-size: 22px; }

      .cad-label {
        background: transparent !important;
        border: none !important;
      }
      .cad-label span {
        display: inline-block;
        white-space: nowrap;
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 600;
        line-height: 1.15;
        color: #0f172a;
        text-shadow:
          0 0 2px #fff,
          0 0 3px #fff,
          1px 0 0 #fff,
          -1px 0 0 #fff,
          0 1px 0 #fff,
          0 -1px 0 #fff;
        pointer-events: none;
        -webkit-font-smoothing: antialiased;
      }

      #msg {
        position: absolute; z-index: 900; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px;
      }
      #msg .card {
        max-width: 380px; padding: 24px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: center;
      }
      #msg h1 { margin: 0 0 8px; font-size: 1.15rem; }
      #msg p { margin: 0 0 16px; color: var(--muted); font-size: 0.92rem; }
      #msg .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      #msg[hidden] { display: none; }

      /* ── เครื่องมือบันทึกบนผัง: ปากกา / กล่องข้อความ / ลบ ── */
      .ann-wrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
      .ann-body { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
      .ann-body[hidden] { display: none; }
      .ann-toggle[aria-expanded="true"] { background: var(--primary); color: #fff; }
      .ann-panel {
        display: flex; gap: 6px; padding: 4px; border-radius: 12px;
        background: var(--card); border: 1px solid var(--line); box-shadow: 0 1px 6px rgba(0,0,0,.18);
      }
      .ann-colors { display: flex; gap: 8px; padding: 6px 8px; }
      .ann-colors[hidden] { display: none; }
      .ann-swatch {
        width: 28px; height: 28px; border-radius: 50%; padding: 0; cursor: pointer;
        border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line);
      }
      .ann-swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--primary); }
      .ann-btn {
        width: 42px; height: 42px; border: 0; border-radius: 10px; padding: 0; cursor: pointer;
        background: transparent; color: var(--text); display: flex; align-items: center; justify-content: center;
      }
      .ann-btn[aria-pressed="true"] { background: var(--primary); color: #fff; }
      .ann-btn:disabled { opacity: .35; cursor: default; }
      .ann-btn-txt { font: 800 15px/1 'Noto Sans Thai', system-ui, sans-serif; }
      .ann-btn:focus-visible, .ann-swatch:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
      .note-box { background: none; border: 0; width: max-content !important; height: auto !important; }
      .note-box span {
        display: inline-block; max-width: 260px; padding: 3px 7px; border-radius: 6px; border: 2px solid;
        background: rgba(255,255,255,.96); font: 600 15px/1.3 'Noto Sans Thai', system-ui, sans-serif;
        white-space: pre-wrap; word-break: break-word; box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: pointer;
        transform: scale(var(--note-s, 1)); transform-origin: 0 0;
      }
      .note-box.note-center span { transform: translate(-50%, -50%) scale(var(--note-s, 1)); transform-origin: 50% 50%; }
      .note-box span.note-stamp { font-size: 18px; font-weight: 800; padding: 2px 9px; border-width: 3px; background: #fff; }
      .note-box.note-center span.note-stamp { transform: translate(-50%, -50%) scale(calc(max(var(--note-s, 1), 0.6) * 0.6)); }
      .ann-editor {
        position: absolute; z-index: 1100; transform: translate(-4px, -4px);
        min-width: 160px; max-width: 280px; padding: 0; border: 2px solid var(--primary); border-radius: 6px;
        background: rgba(255,255,255,.97); color: #0f172a;
      }
      .ann-editor textarea {
        display: block; width: 100%; min-height: 44px; border: 0; outline: 0; resize: none; background: transparent;
        font: 600 16px/1.3 'Noto Sans Thai', system-ui, sans-serif; color: inherit; padding: 6px 8px;
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="แผนผังจ่ายไฟ ลากเพื่อเลื่อน ถ่างนิ้วเพื่อซูม"></div>

    <div id="bar">
      <a class="chip chip-icon" href="./" aria-label="กลับหน้าแรก" title="หน้าแรก">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      </a>
      <button type="button" class="chip" id="btn-labels" aria-pressed="false" title="เปิด/ปิดป้ายชื่อคม (HTML)">ป้ายชื่อ: ปิด</button>
      <div id="search-wrap">
        <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="ค้นหาชื่อในผัง เช่น สถานี, หม้อแปลง" aria-label="ค้นหาชื่อในผัง" disabled />
        <ul id="results" hidden role="listbox"></ul>
      </div>
    </div>

    <div id="info" hidden></div>

    <div id="msg">
      <div class="card">
        <h1 id="msg-title">กำลังโหลดแผนผัง...</h1>
        <p id="msg-text">รอสักครู่</p>
        <div class="row" id="msg-actions" hidden>
          <a class="chip" href="./">กลับหน้าแรก</a>
          <a class="chip" href="viewer.html?device=mobile">เปิดตัวดู CAD แบบเดิม</a>
        </div>
      </div>
    </div>

    <script src="vendor/leaflet/leaflet.js"></script>
    <script>
      (function () {
        'use strict';
        var BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
        var LABEL_KEY = 'cad_map_html_labels';
        var msg = document.getElementById('msg');

        function showMessage(title, text, actions) {
          document.getElementById('msg-title').textContent = title;
          document.getElementById('msg-text').textContent = text;
          document.getElementById('msg-actions').hidden = !actions;
          msg.hidden = false;
        }

        function esc(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        function readLabelsOn() {
          try { return localStorage.getItem(LABEL_KEY) === '1'; } catch (e) { return false; }
        }
        function writeLabelsOn(on) {
          try { localStorage.setItem(LABEL_KEY, on ? '1' : '0'); } catch (e) {}
        }

        fetch('map/meta.json', { cache: 'no-cache' })
          .then(function (r) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return r.json();
          })
          .then(start)
          .catch(function () {
            showMessage(
              'ยังไม่มีแผนผังแบบแผนที่',
              'ระบบกำลังสร้างจากไฟล์ล่าสุด (ใช้เวลาประมาณ 10-20 นาที) ลองใหม่อีกครั้งภายหลัง หรือเปิดตัวดู CAD แบบเดิมไปก่อน',
              true
            );
          });

        function start(meta) {
          var Z = meta.maxZoom, W = meta.w, H = meta.h;
          var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
          var map = L.map('map', {
            crs: L.CRS.Simple,
            zoomSnap: 0.25,
            zoomDelta: 0.5,
            wheelPxPerZoomLevel: 90,
            attributionControl: false,
            zoomControl: false,
            inertia: true,
            bounceAtZoomLimits: false,
            maxBoundsViscosity: 0.7
          });

          function ll(x, y) { return map.unproject([x, y], Z); }
          var bounds = L.latLngBounds(ll(0, H), ll(W, 0));
          var fitZoom = map.getBoundsZoom(bounds, false);
          map.setMinZoom(fitZoom - 0.5);
          map.setMaxZoom(Z + 2);

          var versionTag = meta.generatedAt ? encodeURIComponent(meta.generatedAt) : String(meta.generatorVersion || '');
          var tileLayer = L.tileLayer('map/tiles/{z}/{x}/{y}.webp' + (versionTag ? '?v=' + versionTag : ''), {
            tileSize: meta.tile || 256,
            minNativeZoom: 0,
            maxNativeZoom: Z,
            minZoom: fitZoom - 0.5,
            maxZoom: Z + 2,
            noWrap: true,
            bounds: bounds,
            errorTileUrl: BLANK,
            keepBuffer: isTouch ? 2 : 3,
            updateWhenIdle: isTouch,
            updateWhenZooming: !isTouch
          });

          tileLayer.on('tileerror', function (ev) {
            var img = ev && ev.tile;
            if (!img || !ev.coords) return;
            var tries = (img._retryCount || 0) + 1;
            if (tries > 2) return;
            img._retryCount = tries;
            var c = ev.coords;
            var retryUrl = 'map/tiles/' + c.z + '/' + c.x + '/' + c.y + '.webp?r=' + tries + (versionTag ? '&v=' + versionTag : '');
            setTimeout(function () {
              if (img.parentNode) {
                img.src = retryUrl;
              }
            }, tries * 450);
          });

          tileLayer.addTo(map);

          L.control.zoom({ position: 'bottomright', zoomInText: '+', zoomOutText: '−' }).addTo(map);
          // ปุ่ม Zoom to fit: กลับมาดูทั้งผังพอดีจอ
          var FitControl = L.Control.extend({
            options: { position: 'bottomright' },
            onAdd: function () {
              var box = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
              var a = L.DomUtil.create('a', 'fit-btn', box);
              a.href = '#';
              a.role = 'button';
              a.title = 'ดูทั้งผัง (Zoom to fit)';
              a.setAttribute('aria-label', 'ดูทั้งผังพอดีจอ');
              a.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
              L.DomEvent.disableClickPropagation(box);
              L.DomEvent.on(a, 'click', function (e) {
                L.DomEvent.preventDefault(e);
                map.fitBounds(bounds, { animate: true });
              });
              return box;
            }
          });
          new FitControl().addTo(map);
          map.fitBounds(bounds, { animate: false });
          map.setMaxBounds(bounds.pad(0.25));
          msg.hidden = true;

          var info = document.getElementById('info');
          var parts = [];
          if (meta.sourceModified) {
            var d = new Date(meta.sourceModified);
            if (!isNaN(d)) parts.push('ผังอัปเดต ' + d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }));
          }
          if (meta.sourceName) parts.push(meta.sourceName.replace(/\.(dwg|dxf)$/i, ''));
          if (parts.length) { info.textContent = parts.join(' · '); info.hidden = false; }

          setupSearchAndLabels(map, Z, ll);
          setupAnnotations(map, meta);
        }

        function setupAnnotations(map, meta) {
          var COLORS = [
            { c: '#dc2626', n: 'แดง' }, { c: '#2563eb', n: 'น้ำเงิน' }, { c: '#eab308', n: 'เหลือง' },
            { c: '#16a34a', n: 'เขียว' }, { c: '#0f172a', n: 'ดำ' }
          ];
          var color = COLORS[0].c;
          var tool = null;          // null | 'pen' | 'text' | 'erase'
          var KEY = 'cad_notes_' + meta.w + 'x' + meta.h + '_' + meta.maxZoom;
          var layer = L.layerGroup().addTo(map);
          var history = [];
          var editor = null;
          var cur = null, pts = null;
          var panelEl = null;

          function readStore() {
            try { var d = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(d) ? d : []; } catch (e) { return []; }
          }
          function writeStore() {
            var data = [];
            layer.eachLayer(function (l) { if (l._note) data.push(l._note); });
            try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
          }
          function refresh() {
            if (!panelEl) return;
            var btns = panelEl.querySelectorAll('[data-tool]');
            for (var i = 0; i < btns.length; i++) {
              btns[i].setAttribute('aria-pressed', String(btns[i].getAttribute('data-tool') === tool));
            }
            panelEl.querySelector('[data-act="undo"]').disabled = history.length === 0;
            panelEl.querySelector('.ann-colors').hidden = !(tool === 'pen' || tool === 'text');
            var cont = map.getContainer();
            cont.style.cursor = (tool === 'pen' || tool === 'close' || tool === 'open') ? 'crosshair' : tool === 'text' ? 'text' : tool === 'erase' ? 'pointer' : '';
            var sw = panelEl.querySelectorAll('.ann-swatch');
            for (var j = 0; j < sw.length; j++) sw[j].setAttribute('aria-pressed', String(COLORS[j].c === color));
            if (tool === 'pen') map.dragging.disable(); else map.dragging.enable();
          }
          function setTool(t) {
            closeEditor(false);
            tool = tool === t ? null : t;
            refresh();
          }
          function addNote(note) {
            var l;
            if (note.t === 'pen') {
              l = L.polyline(note.p.map(function (q) { return L.latLng(q[0], q[1]); }), {
                color: note.c, weight: 4, lineCap: 'round', lineJoin: 'round', interactive: false
              });
            } else {
              l = L.marker(L.latLng(note.p[0], note.p[1]), {
                icon: L.divIcon({
                  className: 'note-box' + (note.k === 'stamp' ? ' note-center' : ''),
                  html: '<span class="' + (note.k === 'stamp' ? 'note-stamp' : '') + '" style="border-color:' + note.c + ';color:' + note.c + '">' + esc(note.s) + '</span>',
                  iconSize: null
                }),
                keyboard: false, interactive: false
              });
            }
            l._note = note;
            layer.addLayer(l);
            return l;
          }
          function commit(l) { history.push(l); writeStore(); refresh(); }

          // ── ปากกา (freehand) ──
          map.on('mousedown', function (e) {
            if (tool !== 'pen' || !e.latlng) return;
            pts = [[e.latlng.lat, e.latlng.lng]];
            cur = L.polyline([e.latlng], { color: color, weight: 4, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(map);
          });
          map.on('mousemove', function (e) {
            if (!cur || !e.latlng) return;
            var last = map.latLngToContainerPoint(L.latLng(pts[pts.length - 1]));
            if (last.distanceTo(map.latLngToContainerPoint(e.latlng)) < 3) return;
            pts.push([e.latlng.lat, e.latlng.lng]);
            cur.addLatLng(e.latlng);
          });
          function finishStroke() {
            if (!cur) return;
            map.removeLayer(cur);
            var stroke = pts.length > 1 ? addNote({ t: 'pen', c: color, p: pts }) : null;
            cur = null; pts = null;
            if (stroke) commit(stroke);
          }
          map.on('mouseup mouseout', finishStroke);

          // ── กล่องข้อความ ──
          function closeEditor(save) {
            if (!editor) return;
            var ed = editor; editor = null;
            var val = ed.ta.value.trim();
            ed.el.remove();
            if (save && val) commit(addNote({ t: 'text', c: color, s: val, p: [ed.ll.lat, ed.ll.lng] }));
          }
          function openEditor(latlng, containerPoint) {
            closeEditor(false);
            var el = L.DomUtil.create('div', 'ann-editor', map.getContainer());
            el.style.left = containerPoint.x + 'px';
            el.style.top = containerPoint.y + 'px';
            var ta = L.DomUtil.create('textarea', '', el);
            ta.rows = 2; ta.placeholder = 'พิมพ์ข้อความ';
            ta.setAttribute('aria-label', 'ข้อความกล่องบันทึก');
            ta.style.color = color;
            editor = { el: el, ta: ta, ll: latlng };
            L.DomEvent.disableClickPropagation(el);
            L.DomEvent.on(ta, 'keydown', function (e) {
              if (e.key === 'Escape') { e.preventDefault(); closeEditor(false); }
              else if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); closeEditor(true); }
            });
            L.DomEvent.on(ta, 'blur', function () { closeEditor(true); });
            setTimeout(function () { ta.focus(); }, 0);
          }
          // ── ลบ: หาบันทึกที่อยู่ใกล้จุดที่แตะ (ไม่พึ่งการแตะโดนเส้นโดยตรง ซึ่งบนมือถือพลาดง่าย) ──
          function distToSeg(p, a, b) {
            var dx = b.x - a.x, dy = b.y - a.y, len = dx * dx + dy * dy;
            var t = len ? Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len)) : 0;
            return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
          }
          function eraseAt(e) {
            var p = e.containerPoint;
            var ox = e.originalEvent ? e.originalEvent.clientX : null;
            var oy = e.originalEvent ? e.originalEvent.clientY : null;
            var hit = null;
            layer.eachLayer(function (l) {
              if (!l._note) return;
              if (l._note.t === 'pen') {
                var pts = l.getLatLngs().map(function (q) { return map.latLngToContainerPoint(q); });
                for (var i = 1; i < pts.length; i++) {
                  if (distToSeg(p, pts[i - 1], pts[i]) <= 14) { hit = l; return; }
                }
              } else {
                var el = l.getElement();
                if (!el || ox === null) return;
                var r = (el.querySelector('span') || el).getBoundingClientRect();
                if (ox >= r.left - 10 && ox <= r.right + 10 && oy >= r.top - 10 && oy <= r.bottom + 10) hit = l;
              }
            });
            if (!hit) return;
            history = history.filter(function (x) { return x !== hit; });
            layer.removeLayer(hit);
            writeStore(); refresh();
          }

          map.on('click', function (e) {
            if (tool === 'erase') { eraseAt(e); return; }
            if (tool === 'close' || tool === 'open') {
              commit(addNote({ t: 'text', k: 'stamp', c: tool === 'close' ? '#dc2626' : '#16a34a', s: tool === 'close' ? 'สับ' : 'ปลด', p: [e.latlng.lat, e.latlng.lng] }));
              return;
            }
            if (tool !== 'text') return;
            if (editor) { closeEditor(true); return; }
            openEditor(e.latlng, e.containerPoint);
          });
          map.on('movestart', function () { if (editor) closeEditor(true); });

          // ── แผงควบคุม ──
          var PanelControl = L.Control.extend({
            options: { position: 'bottomright' },
            onAdd: function () {
              var wrap = L.DomUtil.create('div', 'ann-wrap');
              var colorsHtml = COLORS.map(function (o, i) {
                return '<button type="button" class="ann-swatch" data-color="' + i + '" style="background:' + o.c + '" aria-label="สี' + o.n + '" title="สี' + o.n + '"></button>';
              }).join('');
              wrap.innerHTML =
                '<div class="ann-body" hidden>' +
                '<div class="ann-panel ann-colors" hidden>' + colorsHtml + '</div>' +
                '<div class="ann-panel">' +
                  '<button type="button" class="ann-btn" data-tool="pen" aria-label="ปากกาวาดอิสระ" title="ปากกา">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></button>' +
                  '<button type="button" class="ann-btn" data-tool="text" aria-label="กล่องข้อความ" title="กล่องข้อความ">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V4h16v3M9 20h6M12 4v16"/></svg></button>' +
                  '<button type="button" class="ann-btn ann-btn-txt" data-tool="close" aria-label="ตราสับ (วางทับอุปกรณ์)" title="สับ">สับ</button>' +
                  '<button type="button" class="ann-btn ann-btn-txt" data-tool="open" aria-label="ตราปลด (วางทับอุปกรณ์)" title="ปลด">ปลด</button>' +
                  '<button type="button" class="ann-btn" data-tool="erase" aria-label="ลบบันทึก (แตะที่เส้นหรือกล่อง)" title="ลบ">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H9L3 14l10-10 7 7-4 4"/><path d="M6.5 13.5l4 4"/></svg></button>' +
                  '<button type="button" class="ann-btn" data-act="undo" aria-label="ย้อนกลับ" title="ย้อนกลับ">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>' +
                  '<button type="button" class="ann-btn" data-act="clear" aria-label="ลบบันทึกทั้งหมด" title="ลบทั้งหมด">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>' +
                '</div>' +
                '</div>' +
                '<div class="ann-panel">' +
                  '<button type="button" class="ann-btn ann-toggle" data-toggle="1" aria-expanded="false" aria-label="เปิดเครื่องมือวาดและเขียน" title="เครื่องมือวาด/เขียน">' +
                    '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></button>' +
                '</div>';
              L.DomEvent.disableClickPropagation(wrap);
              L.DomEvent.disableScrollPropagation(wrap);
              wrap.addEventListener('click', function (e) {
                var t = e.target.closest('button');
                if (!t || !wrap.contains(t)) return;
                if (t.hasAttribute('data-toggle')) {
                  var body = wrap.querySelector('.ann-body');
                  var open = body.hidden;
                  body.hidden = !open;
                  t.setAttribute('aria-expanded', String(open));
                  if (!open) { closeEditor(true); tool = null; refresh(); }
                  return;
                }
                if (t.hasAttribute('data-tool')) setTool(t.getAttribute('data-tool'));
                else if (t.hasAttribute('data-color')) { color = COLORS[+t.getAttribute('data-color')].c; refresh(); }
                else if (t.getAttribute('data-act') === 'undo') {
                  var last = history.pop();
                  if (last) { layer.removeLayer(last); writeStore(); }
                  refresh();
                } else if (t.getAttribute('data-act') === 'clear') {
                  if (!layer.getLayers().length) return;
                  if (!window.confirm('ลบบันทึกทั้งหมดบนผังนี้?')) return;
                  closeEditor(false);
                  layer.clearLayers(); history = []; writeStore(); refresh();
                }
              });
              panelEl = wrap;
              return wrap;
            }
          });
          new PanelControl().addTo(map);

          // ข้อความกล่องย่อตามการซูมออก (ไม่ใหญ่ตามเวลาซูมออกจนบังผัง)
          function updateNoteScale() {
            var sc = Math.min(1.25, Math.max(0.4, Math.pow(2, map.getZoom() - meta.maxZoom)));
            map.getContainer().style.setProperty('--note-s', sc.toFixed(3));
          }
          map.on('zoomend', updateNoteScale);
          updateNoteScale();

          readStore().forEach(function (n) { history.push(addNote(n)); });
          refresh();
        }

        function setupSearchAndLabels(map, Z, ll) {
          var q = document.getElementById('q');
          var list = document.getElementById('results');
          var btn = document.getElementById('btn-labels');
          var items = null, loading = false, marker = null;
          var labelLayer = L.layerGroup().addTo(map);
          var labelTimer = null;
          // ปุ่มป้ายชื่อถูกซ่อนอยู่ → ปิดป้ายชื่อเสมอ (ไม่อ่านค่าที่เคยบันทึกไว้) ตั้งเป็น true เพื่อเปิดใช้ปุ่มอีกครั้ง
          var LABELS_BUTTON_ENABLED = false;
          var labelsOn = LABELS_BUTTON_ENABLED ? readLabelsOn() : false;

          function syncBtn() {
            btn.classList.toggle('on', labelsOn);
            btn.setAttribute('aria-pressed', labelsOn ? 'true' : 'false');
            btn.textContent = labelsOn ? 'ป้ายชื่อ: เปิด' : 'ป้ายชื่อ: ปิด';
          }
          syncBtn();

          btn.addEventListener('click', function () {
            labelsOn = !labelsOn;
            writeLabelsOn(labelsOn);
            syncBtn();
            scheduleLabels();
          });

          function load() {
            if (items || loading) return;
            loading = true;
            fetch('map/index.json', { cache: 'no-cache' })
              .then(function (r) { return r.json(); })
              .then(function (j) {
                items = (j.items || []).map(function (it) {
                  return {
                    t: it[0],
                    k: String(it[0]).toLowerCase(),
                    x: it[1],
                    y: it[2],
                    fs: it[3] || 10
                  };
                });
                items.sort(function (a, b) { return b.fs - a.fs; });
                q.disabled = false;
                if (q.value) render();
                scheduleLabels();
              })
              .catch(function () { q.placeholder = 'ค้นหาใช้ไม่ได้ในขณะนี้'; })
              .then(function () { loading = false; });
          }
          load();
          q.disabled = false;

          function search(text) {
            var s = text.trim().toLowerCase();
            if (!items || s.length < 1) return [];
            var starts = [], has = [];
            for (var i = 0; i < items.length; i++) {
              var p = items[i].k.indexOf(s);
              if (p === 0) starts.push(items[i]);
              else if (p > 0) has.push(items[i]);
              if (starts.length > 400 && has.length > 400) break;
            }
            function byLen(a, b) { return a.t.length - b.t.length; }
            return starts.sort(byLen).concat(has.sort(byLen)).slice(0, 40);
          }

          function render() {
            var text = q.value;
            if (!text.trim()) { list.hidden = true; return; }
            list.innerHTML = '';
            if (!items) {
              list.innerHTML = '<li class="empty">กำลังโหลดดัชนี...</li>';
              list.hidden = false;
              return;
            }
            var res = search(text);
            if (!res.length) {
              list.innerHTML = '<li class="empty">ไม่พบข้อความที่ตรงกัน</li>';
            }
            res.forEach(function (it) {
              var li = document.createElement('li');
              li.textContent = it.t.length > 80 ? it.t.slice(0, 80) + '…' : it.t;
              li.setAttribute('role', 'option');
              li.addEventListener('pointerdown', function (e) { e.preventDefault(); go(it); });
              list.appendChild(li);
            });
            list.hidden = false;
          }

          function go(it) {
            list.hidden = true;
            q.blur();
            var p = ll(it.x, it.y);
            map.flyTo(p, Z, { duration: 0.8 });
            if (marker) map.removeLayer(marker);
            marker = L.circleMarker(p, { radius: 26, color: '#dc2626', weight: 3, fillColor: '#dc2626', fillOpacity: 0.08 }).addTo(map);
            marker.on('click', function () { map.removeLayer(marker); marker = null; });
            setTimeout(scheduleLabels, 900);
          }

          function scheduleLabels() {
            if (labelTimer) clearTimeout(labelTimer);
            labelTimer = setTimeout(updateLabels, 120);
          }

          function updateLabels() {
            labelLayer.clearLayers();
            if (!labelsOn || !items || !items.length) return;

            var z = map.getZoom();
            if (z < Z - 1.5) return;

            var b = map.getBounds();
            var sw = map.project(b.getSouthWest(), Z);
            var ne = map.project(b.getNorthEast(), Z);
            var minX = Math.min(sw.x, ne.x) - 40;
            var maxX = Math.max(sw.x, ne.x) + 40;
            var minY = Math.min(sw.y, ne.y) - 40;
            var maxY = Math.max(sw.y, ne.y) + 40;

            var minFs = z >= Z ? 7 : 11;
            var maxLabels = z >= Z ? 220 : 100;
            var scale = Math.pow(2, Math.max(0, z - Z));
            if (z <= Z) scale = Math.max(0.55, Math.pow(2, z - Z));
            var shown = 0;

            for (var i = 0; i < items.length; i++) {
              var it = items[i];
              if (it.fs < minFs) continue;
              if (it.x < minX || it.x > maxX || it.y < minY || it.y > maxY) continue;
              if (it.t.length > 60 && it.fs < 14) continue;

              var fontPx = Math.max(11, Math.min(30, it.fs * scale * 0.9));
              var icon = L.divIcon({
                className: 'cad-label',
                html: '<span style="font-size:' + fontPx.toFixed(1) + 'px">' + esc(it.t) + '</span>',
                iconSize: [1, 1],
                iconAnchor: [0, fontPx * 0.7]
              });
              L.marker(ll(it.x, it.y), { icon: icon, interactive: false, keyboard: false }).addTo(labelLayer);
              if (++shown >= maxLabels) break;
            }
          }

          q.addEventListener('input', render);
          q.addEventListener('focus', render);
          q.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') { var r = search(q.value); if (r.length) go(r[0]); }
            if (e.key === 'Escape') { list.hidden = true; q.blur(); }
          });
          map.on('click movestart', function () { list.hidden = true; });
          map.on('moveend zoomend', scheduleLabels);
        }
      })();
    </script>
  </body>
</html>
